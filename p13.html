<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox and Grid</title>
    <style>
        header{
            background-color: black;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1{
            text-align: center;
            color: red;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        nav{
            display: flex;
            gap: 15px;
        }

        nav a{
            color: white;
            text-decoration: none;
        }

        .container{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .card{
            background-color: aqua;
            padding: 20px;
            text-align: center;
            border: 2px solid black;
            
        }

        footer{
            background-color: black;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

        @media(max-width: 600px){
            .container{
                grid-template-columns: 1fr;
            }
            
            header{
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h2>My Website</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <h1>My Projects</h1>

    <div id="container">

        <div class="card">
            <h2>Project 1</h2>
            <p>HTML Website</p>
        </div>

        <div class="card">
            <h2>Project 2</h2>
            <p>CSS Website</p>
        </div>

        <div class="card">
            <h2>Project 3</h2>
            <p>Portfolio</p>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
