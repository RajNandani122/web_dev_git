<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Projects</title>
    <style>
        h1{
            text-align: center;
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: darkred;
        }

        #container{
            display: flex;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
        }

        .card{
            background-color: aqua;
            padding: 20px;
            text-align: center;
            border: 2px solid black;
            border-radius: 10px;
        }

        .card button{
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
        }

        @media(max-width: 600px){
            .container{
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>My Portfolio Projects</h1>

    <div id="container">

        <div class="card">
            <h2>Project 1</h2>
            <p>Personal Bio Page</p>
            <button>View Project</button>
        </div>

        <div class="card">
            <h2>Project 2</h2>
            <p>Time table</p>
            <button>View Project</button>
        </div>

        <div class="card">
            <h2>Project 3</h2>
            <p>Student Website</p>
            <button>View Project</button>
        </div>

        <div class="card">
            <h2>Project 4</h2>
            <p>Portfolio Website</p>
            <button>View Project</button>
        </div>

        <div class="card">
            <h2>Project 5</h2>
            <p>Registration Form</p>
            <button>View Project</button>
        </div>

        <div class="card">
            <h2>Project 6</h2>
            <p>Newspaper layout</p>
            <button>View Project</button>
        </div>

    </div>

</body>
</html>
