<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Header and Footer</title>
    <style>
        header{
            background-color: blue;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav{
            display: flex;
            gap: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
        }

        main{
            padding: 40px;
            text-align: center;
            min-height: 300px;
        }

        footer{
            background-color: black;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .social-media{
            display: flex;
            gap: 15px;
        }

        @media(max-width: 600px){
            header,footer{
                flex-direction: column;
                gap: 15px;
            }

            nav {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <h2>My Portfolio</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Welcome to My Portfolio.</h1>
        <p>I am Raj Nandani. I am first year btech student persuing my engineering from Bosscoder School of Technology.</p>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio</p>

        <div class="social-media">
            <a href="#">Instagram</a>
            <a href="#">LinkedIn</a>
            <a href="#">GitHub</a>
        </div>
    </footer>

</body>
</html>
