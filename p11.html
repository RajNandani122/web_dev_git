<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newspaper Layout</title>
    <style>
        header{
            background-color: blue;
            color: white;
            text-align: center;
        }
        
        #container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .column{
            background-color: aqua;
            padding: 15px;
            border: 1px solid black;
        }

        h2{
            color: darkblue;
        }

        @media(max-width: 600px){
             #container{
                grid-template-columns: 1fr;
             }
        }
        
    </style>
</head>
<body>
    <header>
        <h1>The Hindustan Times</h1>
        <p>Date : 04|11|2026</p>
    </header>

    <div id="container">

        <div class="column">
            <h2>Sports News</h2>
            <p>India wins with 20 runs against Pakistan.</p>
        </div>

        <div class="column">
            <h2>Finance News</h2>
            <p>India's GDP is growing day-by-day.</p>
        </div>

        <div class="column">
            <h2>Education News</h2>
            <p>Education system is changing day-by-day.</p>
        </div>

    </div>

</body>
</html>
